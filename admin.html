<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PICNEST Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--ink:#211c19;--gold:#b58a4b;--cream:#fbf8f2;--line:#e9dfd1;--muted:#766b62}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,Arial}.bar{background:#211c19;color:#fff;padding:20px 5vw;display:flex;justify-content:space-between;align-items:center}.brand{font:25px Georgia,serif;letter-spacing:.15em}.wrap{max-width:1200px;margin:35px auto;padding:0 20px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:20px}.login{max-width:450px;margin:8vh auto}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.17em;font-weight:800}.h{font:32px Georgia,serif;margin:9px 0 18px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:11px 17px;font-weight:700;cursor:pointer}.btn.gold{background:var(--gold)}.btn.light{background:#f1e8dc;color:var(--ink)}.tabs{display:flex;gap:8px;margin:20px 0}.tab{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:999px;cursor:pointer}.tab.active{background:var(--ink);color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:#f7f1e8;border-radius:14px;padding:18px}.stat b{font:28px Georgia,serif;display:block;margin-top:7px}.order{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px;line-height:1.5}.pill{display:inline-block;background:#f1e8dc;border-radius:30px;padding:5px 10px;font-size:11px;margin:3px}.select{padding:9px;border:1px solid var(--line);border-radius:9px;background:white}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#211c19;color:white;padding:13px 18px;border-radius:12px;display:none;max-width:90%}.toast.show{display:block}a{color:#946d35}@media(max-width:650px){.stats{grid-template-columns:1fr}.bar{padding:16px 20px}.h{font-size:27px}}
</style></head><body><header class="bar"><div class="brand">PICNEST <span style="font:11px Inter,sans-serif;letter-spacing:.12em;color:#d5b783">ADMIN</span></div><button class="btn light hidden" id="logout" onclick="logout()">Sign out</button></header>
<div class="wrap"><section id="loginBox" <section id="loginBox" class="panel login">
  <div class="eyebrow">PRIVATE ADMIN ACCESS</div>
  <h1 class="h">Admin Sign In</h1>
  <p class="muted">Sign in using your authorised PICNEST admin email.</p>

  <div class="field">
    <label>Admin Email</label>
    <input id="adminEmail" type="email"
      placeholder="Enter admin email" autocomplete="username">
  </div>

  <div class="field">
    <label>Password</label>
    <input id="adminPassword" type="password"
      placeholder="Enter password" autocomplete="current-password">
  </div>

  <button class="btn gold" style="width:100%"
    onclick="adminLogin()">
    Sign In
  </button>
</section>
<section id="dashboard" class="hidden"><div class="row" style="align-items:end"><div><div class="eyebrow">STORE OVERVIEW</div><h1 class="h">Orders & enquiries</h1><p class="muted">Private PICNEST operations dashboard.</p></div><button class="btn gold" onclick="loadData()">Refresh</button></div><div class="stats"><div class="stat">Total orders<b id="sOrders">0</b></div><div class="stat">Pending payment<b id="sPending">0</b></div><div class="stat">Event enquiries<b id="sEvents">0</b></div></div><div class="tabs"><button class="tab active" onclick="showTab('orders',this)">Orders</button><button class="tab" onclick="showTab('events',this)">Event enquiries</button></div><div id="ordersPanel" class="panel"><div class="row"><h2 class="h" style="font-size:25px">Customer orders</h2><span class="muted">Newest first</span></div><div id="orders"></div></div><div id="eventsPanel" class="panel hidden"><h2 class="h" style="font-size:25px">Event enquiries</h2><div id="events"></div></div></section></div><div class="toast" id="toast"></div>
<script>
// Must match the Supabase URL and publishable/anon key in index.html.
const SUPABASE_URL='https://euthspxgyrhtmsdswaoa.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_wiW6ZFMiOfU7KMRXiDie2g_aCNluimz';
let sb=null,phone=null,session=null;
function client(){if(!SUPABASE_URL.startsWith('http')||SUPABASE_ANON_KEY.includes('YOUR_'))throw Error('Set your Supabase URL and key in admin.html.');return sb||(sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY))}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3500)}
function cleanPhone(v){let n=v.replace(/[^0-9+]/g,'');if(n.startsWith('0'))n=n.slice(1);if(!n.startsWith('+'))n='+91'+n;return n}
async function sendOtp(){try{phone=cleanPhone(document.getElementById('phone').value);if(phone.replace(/\D/g,'').length<10)throw Error('Enter a valid admin mobile number.');let {error}=await client().auth.signInWithOtp({phone,options:{shouldCreateUser:true}});if(error)throw error;document.getElementById('phoneBox').classList.add('hidden');document.getElementById('otpBox').classList.remove('hidden');toast('OTP sent.')}catch(e){toast(e.message)}}
function back(){document.getElementById('otpBox').classList.add('hidden');document.getElementById('phoneBox').classList.remove('hidden')}
async function verifyOtp(){try{let token=document.getElementById('otp').value.trim();let {data,error}=await client().auth.verifyOtp({phone,token,type:'sms'});if(error)throw error;session=data.session;let {data:allowed,error:ae}=await client().from('picnest_admins').select('phone').eq('phone',phone).maybeSingle();if(ae)throw ae;if(!allowed){await client().auth.signOut();session=null;throw Error('This phone number is not authorised for PICNEST admin access. Add it to picnest_admins in Supabase first.')}document.getElementById('loginBox').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');document.getElementById('logout').classList.remove('hidden');await loadData()}catch(e){toast(e.message||'Could not verify admin access.')}}
async function loadData(){try{let c=client();let [{data:orders,error:oe},{data:events,error:ee}]=await Promise.all([c.from('picnest_orders').select('*').order('created_at',{ascending:false}),c.from('picnest_events').select('*').order('created_at',{ascending:false})]);if(oe)throw oe;if(ee)throw ee;orders=orders||[];events=events||[];for(const o of orders){for(const it of (o.items||[])){it.photo_urls=[];for(const path of (it.photo_paths||[])){const {data:signed}=await c.storage.from('picnest-photos').createSignedUrl(path,3600);if(signed?.signedUrl)it.photo_urls.push(signed.signedUrl)}}}document.getElementById('sOrders').textContent=orders.length;document.getElementById('sPending').textContent=orders.filter(o=>o.payment_status!=='Paid').length;document.getElementById('sEvents').textContent=events.length;document.getElementById('orders').innerHTML=orders.length?orders.map(orderCard).join(''):'<p class="muted">No orders yet.</p>';document.getElementById('events').innerHTML=events.length?events.map(eventCard).join(''):'<p class="muted">No event enquiries yet.</p>'}catch(e){toast(e.message||'Could not load dashboard data.')}}
function orderCard(o){let items=Array.isArray(o.items)?o.items:[];return `<article class="order"><div class="row"><div><b>${esc(o.id)}</b><div class="muted">${new Date(o.created_at).toLocaleString('en-IN')}</div></div><div><span class="pill">${esc(o.status)}</span><span class="pill">${esc(o.payment_status)}</span></div></div><p><b>${esc(o.customer_name||'Customer')}</b> · <a href="https://wa.me/${String(o.customer_phone||'').replace(/\D/g,'')}" target="_blank">${esc(o.customer_phone||'')}</a><br><span class="muted">${esc(o.delivery_address||'')}</span></p><div class="muted">${items.map(i=>`${esc(i.name)} × ${i.quantity} — ₹${Number(i.line_total||0).toLocaleString('en-IN')}${i.notes?' | '+esc(i.notes):''}${(i.photo_urls||[]).map((u,n)=>`<br><a href="${u}" target="_blank">Open customer photo ${n+1}</a>`).join('')}`).join('<br>')}</div><div class="row" style="align-items:center;margin-top:13px"><b style="font-size:19px">₹${Number(o.total||0).toLocaleString('en-IN')}</b><div><select class="select" id="st-${safeId(o.id)}"><option ${o.status==='New'?'selected':''}>New</option><option ${o.status==='Confirmed'?'selected':''}>Confirmed</option><option ${o.status==='In Production'?'selected':''}>In Production</option><option ${o.status==='Ready'?'selected':''}>Ready</option><option ${o.status==='Dispatched'?'selected':''}>Dispatched</option><option ${o.status==='Completed'?'selected':''}>Completed</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select> <select class="select" id="pay-${safeId(o.id)}"><option ${o.payment_status==='Pending'?'selected':''}>Pending</option><option ${o.payment_status==='Advance Paid'?'selected':''}>Advance Paid</option><option ${o.payment_status==='Paid'?'selected':''}>Paid</option><option ${o.payment_status==='Refunded'?'selected':''}>Refunded</option></select> <button class="btn" onclick="updateOrder('${safeId(o.id)}','${escAttr(o.id)}')">Save</button></div></div>${items.some(i=>i.photo_paths?.length)?`<p class="muted">Customer photos are stored privately in Supabase Storage. Use the customer/order record to retrieve them through an authorised admin workflow.</p>`:''}</article>`}
function eventCard(e){return `<article class="order"><div class="row"><b>${esc(e.name||'')}</b><span class="pill">${esc(e.event_type||'Event')}</span></div><p class="muted">${esc(e.phone||'')} · ${esc(e.event_date||'Date not decided')} · ${esc(e.city_venue||'')}</p><p>${esc(e.notes||'')}</p><a href="https://wa.me/${String(e.phone||'').replace(/\D/g,'')}" target="_blank">Contact on WhatsApp</a></article>`}
async function updateOrder(id,original){try{let status=document.getElementById('st-'+id).value,payment_status=document.getElementById('pay-'+id).value,{error}=await client().from('picnest_orders').update({status,payment_status}).eq('id',original);if(error)throw error;toast('Order updated.');await loadData()}catch(e){toast(e.message)}}
function showTab(which,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('ordersPanel').classList.toggle('hidden',which!=='orders');document.getElementById('eventsPanel').classList.toggle('hidden',which!=='events')}
async function logout(){await client().auth.signOut();location.reload()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return String(s).replace(/[^a-zA-Z0-9_-]/g,'_')}function safeId(s){return String(s).replace(/[^a-zA-Z0-9_-]/g,'_')}
</script></body></html>
